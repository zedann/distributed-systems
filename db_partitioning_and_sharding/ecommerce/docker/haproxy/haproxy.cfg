global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode tcp
    option tcplog

    timeout connect 5s
    timeout client 30s
    timeout server 30s


# =========================================================
# WRITE
# Only the current Patroni leader
# =========================================================

frontend postgres_write
    bind *:5432

    default_backend postgres_primary


backend postgres_primary
    mode tcp

    option httpchk GET /primary
    http-check expect status 200

    server postgres1 postgres1:5432 check port 8008
    server postgres2 postgres2:5432 check port 8008
    server postgres3 postgres3:5432 check port 8008


# =========================================================
# READ
# Primary + replicas
# =========================================================

frontend postgres_read
    bind *:5433

    default_backend postgres_read_nodes


backend postgres_read_nodes
    mode tcp

    option httpchk GET /health
    http-check expect status 200

    balance roundrobin

    server postgres1 postgres1:5432 check port 8008
    server postgres2 postgres2:5432 check port 8008
    server postgres3 postgres3:5432 check port 8008

