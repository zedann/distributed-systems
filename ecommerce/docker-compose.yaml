services:
  postgres-primary:
    image: postgres:17
    container_name: postgres-primary
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./docker/postgres/primary/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/postgres/primary/pg_hba.conf:/etc/postgresql/pg_hba.conf
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ecommerce -d ecommerce
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  postgres-replica1:
    image: postgres:17
    container_name: postgres-replica1
    environment:
      PRIMARY_HOST: postgres-primary
      PRIMARY_PORT: 5432
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator_password
    ports:
      - "5433:5432"
    depends_on:
      postgres-primary:
        condition: service_healthy
    volumes:
      - postgres_replica1_data:/var/lib/postgresql/data
      - ./docker/postgres/replica/entrypoint.sh:/replica-entrypoint.sh
    entrypoint:
      - /bin/bash
      - /replica-entrypoint.sh
  postgres-replica2:
    image: postgres:17
    container_name: postgres-replica2
    environment:
      PRIMARY_HOST: postgres-primary
      PRIMARY_PORT: 5432
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator_password
    ports:
      - "5434:5432"
    depends_on:
      postgres-primary:
        condition: service_healthy
    volumes:
      - postgres_replica2_data:/var/lib/postgresql/data
      - ./docker/postgres/replica/entrypoint.sh:/replica-entrypoint.sh
    entrypoint:
      - /bin/bash
      - /replica-entrypoint.sh
volumes:
  postgres_primary_data:
  postgres_replica1_data:
  postgres_replica2_data:
