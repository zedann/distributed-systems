[databases]
ecommerce = host=haproxy port=5432 dbname=ecommerce
* = host=haproxy port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction

max_client_conn = 200
default_pool_size = 20
min_pool_size = 2

server_connect_timeout = 5
server_login_retry = 3

log_connections = 1
log_disconnections = 1